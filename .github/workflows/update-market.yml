name: Update market numbers

on:
  schedule:
    - cron: "17 14 */3 * *"  # every 3 days, ~7am Pacific
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest Redfin data for the Bay Area
        run: python scripts/update_market.py
      - name: Save if anything changed
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add market.json
          if git diff --cached --quiet; then
            echo "No new data since the last check."
          else
            git commit -m "Update market numbers"
            git push
          fi
